defaults:
  # seed for random number generator
  seed: 0
  # training configurations
  train_cfgs:
    # device to use for training, options: cpu, cuda, cuda:0, cuda:0,1, etc.
    device: cpu
    # number of threads for torch
    torch_threads: 16
    # number of vectorized environments
    vector_env_nums: 1
    # number of parallel agent, similar to a3c
    parallel: 1
    # total number of steps to train
    total_steps: 1000000
    # number of evaluate episodes
    eval_episodes: 1
  # algorithm configurations
  algo_cfgs:
    # number of steps to update the policy
    steps_per_epoch: 2000
    # number of steps per sample
    update_cycle: 1
    # number of iterations to update the policy
    update_iters: 1
    # The size of replay buffer
    size: 1000000
    # The size of batch
    batch_size: 256
    # MR.Q replay and update schedule (per environment with vector_env_nums > 1)
    enc_horizon: 5
    Q_horizon: 3
    target_update_freq: 250
    alpha: 0.4
    min_priority: 1.0
    cost_priority_weight: 1.0
    # Representation loss
    dyn_weight: 1.0
    reward_weight: 0.1
    done_weight: 0.1
    cost_prediction_weight: 0.1
    zs_dim: 512
    za_dim: 256
    zsa_dim: 512
    enc_hdim: 512
    enc_activ: elu
    enc_lr: 0.0001
    enc_wd: 0.0001
    num_bins: 65
    lower: -10.0
    upper: 10.0
    # Q and policy networks
    value_hdim: 512
    value_activ: elu
    value_lr: 0.0003
    value_wd: 0.0001
    value_grad_clip: 20.0
    policy_hdim: 512
    policy_lr: 0.0003
    policy_wd: 0.0001
    pre_activ_weight: 0.00001
    target_policy_noise: 0.2
    noise_clip: 0.3
    # normalize reward
    reward_normalize: False
    # normalize cost
    cost_normalize: False
    # normalize observation
    obs_normalize: False
    # Reward and cost discounts
    gamma: 0.99
    cost_gamma: 0.99
    # Collect random transitions before the first MR.Q update.
    start_learning_steps: 10000
    # Whether to use the exploration noise
    use_exploration_noise: True
    # The exploration noise
    exploration_noise: 0.2
    # Number of completed epochs before changing the Lagrange multiplier.
    warmup_epochs: 0
    use_cost: True
  # logger configurations
  logger_cfgs:
    # use wandb for logging
    use_wandb: False
    # wandb project name
    wandb_project: omnisafe
    # use tensorboard for logging
    use_tensorboard: True
    # save model frequency
    save_model_freq: 100
    # save logger path
    log_dir: "./runs"
    # save model path
    window_lens: 10
  # model configurations
  # MRQLag builds its own networks from algo_cfgs; these fields retain OmniSafe metadata.
  model_cfgs:
    # weight initialization mode
    weight_initialization_mode: "kaiming_uniform"
    # actor type
    actor_type: mlp
    # linear learning rate decay
    linear_lr_decay: False
    # Configuration of Actor network
    actor:
      # Size of hidden layers
      hidden_sizes: [256, 256]
      # Activation function
      activation: relu
      # The learning rate of Actor network
      lr: 0.0003
    # Configuration of Critic network
    critic:
      # The number of critic networks
      num_critics: 2
      # Size of hidden layers
      hidden_sizes: [256, 256]
      # Activation function
      activation: relu
      # The learning rate of Critic network
      lr: 0.0003
  # lagrangian configurations
  lagrange_cfgs:
    # Tolerance of constraint violation
    cost_limit: 25.0
    # Initial value of lagrangian multiplier
    lagrangian_multiplier_init: 0.001
    # Learning rate of lagrangian multiplier
    lambda_lr: 0.00001
    # Type of lagrangian optimizer
    lambda_optimizer: "Adam"
